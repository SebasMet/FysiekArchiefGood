<div class="h-fit w-[500px]" hlmCard>
  <div class="pb-2.5" hlmCardHeader>
    <h1 class="text-2xl font-semibold">{{projectData.generalInformation.projectName}}</h1>
    <brn-separator hlmSeparator class="mt-4 border-1 border border-neutral-300" />
  </div>
  <div hlmCardContent>
    <p class="text-muted-foreground text-sm">Placeholder teamname is bezig met dit Project</p>
  </div>
  <div class="justify-between" hlmCardFooter>
    <div>
      <p class="text-muted-foreground text-sm">Voortgang</p>
      <p class="text-xl font-semibold">50.50%</p>
    </div>
    <button hlmBtn (click)="navigateToProject()" variant="outline">Bekijken</button>
  </div>

</div>
