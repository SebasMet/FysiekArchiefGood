<div hlmCard class="flex flex-col gap-y-4 max-w-[450px] h-fit p-4">
    <img class="w-full" src="https://placehold.co/450x350" />
    <div class="flex flex-col gap-y-2">
        <div>
            <p class="font-semibold text-lg"> Title</p>
            <p> Dossiernummer</p>
        </div>
        <div class="flex justify-between">
            <div *ngIf="this.dossierInfo.scanCompleted"  class="p-1 px-3 bg-green-400 font-medium rounded-lg">Geanalyseerd</div>
            <div *ngIf="!this.dossierInfo.scanCompleted"  class="p-1 px-3 bg-gray-400 font-medium rounded-lg">Geen analyse</div>
            <p class="text-muted-foreground text-sm">{{this.dossierInfo.total_pages}}</p>
        </div>
        <div class="flex items-center gap-x-2">
            <hlm-avatar variant="small">
                <img src='assets/avatar.png' alt='spartan logo. Resembling a spartanic shield' hlmAvatarImage />
                <span class='text-white bg-destructive' hlmAvatarFallback>RG</span>
            </hlm-avatar>
            <p class="text-sm text-muted-foreground">Geanalyseerd door Jan Pernot </p>
        </div>
    </div>
    <div class="flex justify-end">
        <button (click)="navigateToReport()" variant="outline" hlmBtn>View</button>
    </div>

</div>
