<div class="flex flex-col gap-y-4">

  <h3>Actor {{actor}}</h3>

  <div class="space-y-1.5">
    <label hlmLabel class="text-base" for="actorNaam"> Naam </label>
    <textarea id="actorNaam" class="min-h-[80px] w-full" hlmInput placeholder="Type your message here."></textarea>
  </div>

  <div class="space-y-1.5">
    <label hlmLabel class="text-base" for="actorBackground"> Achtergrond Actor </label>
    <p class="text-sm text-muted-foreground break-normal">
      De achtergrond van de actor. Dit owrdt gebruikt om een beter resultaat te
      kunnen tonen
    </p>
    <textarea id="actorBackground" class="min-h-[160px] w-full" hlmInput
      placeholder="Type your message here."></textarea>

  </div>

</div>
