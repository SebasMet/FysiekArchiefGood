<div>
  <div class="w-full flex justify-between items-center mb-8">
    <div>
      <h1 class="text-3xl font-semibold mb-2.5">Projecten</h1>
      <h2 class="text-neutral-700 text-sm">Alle beschikbare projecten</h2>
    </div>
    <div>
      <button (click)="navigateToCreateProjectPage()" hlmBtn>
        <ng-icon name="heroPlus" size="20px" strokeWidth="2px" class="mr-1"></ng-icon>
        Nieuw project aanmaken
      </button>
    </div>
  </div>
  <div class="flex flex-wrap gap-4">
    <app-project-list-card [projectData]="project"  *ngFor="let project of projects">
    </app-project-list-card>
  </div>
</div>
