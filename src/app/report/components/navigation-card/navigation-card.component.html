<div hlmCard class="xl:min-w-[330px] md:min-w-[270px] h-fit sticky top-0 pt-3">
  <div hlmCardContent class="space-y-5">
    <input class="min-w-full" hlmInput placeholder="Zoeken" type="text" />
    <div class="flex h-9 items-center">
      <div class="w-[3px] bg-blue-400 mr-2 h-full"></div>
      <ng-icon
        name="heroUsers"
        size="24px"
        strokeWidth="2px"
        class="mr-1"
      ></ng-icon>
      <h1 class="font-medium">Actor</h1>
    </div>
    <div class="flex h-9 items-center">
      <div class="w-[3px] bg-blue-400 mr-2 h-full"></div>
      <ng-icon
        name="heroDocumentText"
        size="24px"
        strokeWidth="2px"
        class="mr-1"
      ></ng-icon>
      <h1 class="font-medium">Samenvatting</h1>
    </div>
    <div class="flex h-9 items-center">
      <div class="w-[3px] bg-blue-400 mr-2 h-full"></div>
      <ng-icon
        name="heroCalendarDays"
        size="24px"
        strokeWidth="2px"
        class="mr-1"
      ></ng-icon>
      <h1 class="font-medium">Looptijd Document</h1>
    </div>
  </div>
</div>
