<div hlmCard class="w-full h-fit">
  <div hlmCardHeader class="text-sm font-medium pb-2">Commentaar</div>
  <div hlmCardContent>
    <textarea class="min-h-[80px] max-h-[300px] w-full" hlmInput
      placeholder="Schrijf een notitie bij deze analyse"></textarea>
  </div>
  <div hlmCardFooter>
    <div class="flex flex-col w-full gap-y-2">
      <label class="flex items-center" hlmLabel>
        <hlm-checkbox class="mr-2" />
        Ik heb de analyse gecontroleerd
      </label>
      <label class="flex items-center" hlmLabel>
        <hlm-checkbox class="mr-2" />
        Ik snap dat ik verantwoordelijk ben
      </label>
      <button hlmBtn class="w-full mt-4">Accepteren</button>
    </div>
  </div>
</div>
