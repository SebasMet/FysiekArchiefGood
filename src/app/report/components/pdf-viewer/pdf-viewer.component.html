<div class="flex gap-x-4">
	<button (click)="goToPrevPage()" [disabled]="currentPage <= 1">
		Previous
	</button>
	<span>Page {{ currentPage }} of {{ totalPages }}</span>
	<button
		(click)="goToNextPage()"
		[disabled]="currentPage >= totalPages"
	>
		Next
	</button>
	<button (click)="zoomIn()">Zoom In</button>
	<button (click)="zoomOut()">Zoom Out</button>
</div>

<!--
  Container needs position: relative so the absolute overlay stays within it.
  Adjust width/height/overflow as needed for your layout.
-->
<div class="relative w-max h-max border border-gray-300 overflow-auto">
  <!-- Canvas for PDF rendering -->
  <canvas #pdfCanvas></canvas>

  <!-- Canvas for drawing overlay -->
  <canvas #overlayCanvas class="absolute top-0 left-0 pointer-events-none"></canvas>
</div>
