<div class="h-screen bg-gray-200 flex flex-col justify-center items-center">
  <section class="w-[30rem] h-fit" hlmCard>

    <div hlmCardHeader>
      <div class="flex items-center" hlmCardTitle>
        <ng-icon
          name="heroUsers"
          size="24px"
          strokeWidth="2px"
          class="mr-1"
        ></ng-icon>
        <h3>Actoren</h3>
      </div>
      <p hlmCardDescription>Wie zijn de actoren in het beleidsdocument</p>
    </div>

    <div hlmCardContent>
      <div class="p-3 flex flex-col gap-y-3" hlmCard>
        <input class="w-full" hlmInput />
        <input class="w-full" hlmInput />
        <input class="w-full" hlmInput />
      </div>
    </div>

    <div hlmCardFooter class="justify-end">
        <button (click)="navigateToReport()" hlmBtn>Analyze</button>
    </div>
  </section>
</div>
