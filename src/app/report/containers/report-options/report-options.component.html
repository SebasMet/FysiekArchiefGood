<div class="h-screen bg-gray-200 flex flex-col justify-center items-center">
  <section class="w-[30rem] h-fit" hlmCard>

    <div hlmCardHeader>
      <div class="flex items-center" hlmCardTitle>
        <ng-icon
          name="heroUsers"
          size="24px"
          strokeWidth="2px"
          class="mr-1"
        ></ng-icon>
        <h3>Actoren</h3>
      </div>
      <p hlmCardDescription>Welke actoren zijn genoemd in het beslisdocument</p>
    </div>

    <div hlmCardContent>
      <div class="p-3 flex flex-col gap-y-3" hlmCard>
        <input #actor1 class="w-full" hlmInput />
        <input #actor2 class="w-full" hlmInput />
        <input #actor3 class="w-full" hlmInput />
      </div>
    </div>

    <div hlmCardFooter class="justify-end">
        <!-- <button (click)="navigateToReport(actor1.value, actor2.value, actor3.value)" hlmBtn>Analyze</button> -->
    </div>
  </section>
</div>
